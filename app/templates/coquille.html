<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monique</title>
<link rel="icon" type="image/x-icon" href="/static/monique.ico">
<link rel="apple-touch-icon" href="/static/monique_touch.png">
<link rel="stylesheet" href="/static/ohmie.css?v=7">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="topleft">
      <button id="menubtn" class="menubtn" aria-label="Ouvrir le menu des départements" aria-expanded="false">
        <span class="bars"><span></span><span></span><span></span></span>
      </button>
      <div class="marque">
        <img class="logo-av" src="/static/monique.png" alt="Monique">
        <span class="date">{{ date }}</span>
      </div>
    </div>
    <div class="moniquecard">
      <img class="mavatar" id="agentav" src="/static/avatars/secretaire.png" alt="">
      <div class="agentmeta">
        <div class="agentnom" id="agentnom">Secrétaire</div>
        <span class="enligne"><span class="dot"></span>En ligne</span>
      </div>
    </div>
  </header>

  <section id="vue">{% include "vue_jour.html" %}</section>
</div>

<!-- Panneau départements (slide-in gauche) -->
<div id="drawer" class="drawer" hidden>
  <div class="scrim" data-close></div>
  <aside class="panel" role="navigation" aria-label="Départements">
    <div class="panel-head">
      <span>Départements</span>
      <button class="panel-x" data-close aria-label="Fermer">×</button>
    </div>
    <div class="arbo">
      {% for dep in departements %}
      <div class="dep">
        <button class="dep-h" type="button">
          <span class="pastille" style="background:{{ dep.couleur }}"></span>
          <span class="dep-nom">{{ dep.nom }}</span>
          <span class="chev">›</span>
        </button>
        <div class="dep-body"><div class="dep-inner">
          {% for p in dep.personas %}
          {% if p.onglets|length == 1 %}
            <button class="perso solo vuelink" type="button"
                    hx-get="{{ p.onglets[0].route }}" hx-target="#vue"
                    data-av="{{ p.avatar }}" data-nom="{{ p.nom }}">
              <img class="av" src="/static/avatars/{{ p.avatar }}" alt=""><span>{{ p.nom }}</span>
            </button>
          {% else %}
            <div class="perso">
              <button class="perso-h" type="button">
                <img class="av" src="/static/avatars/{{ p.avatar }}" alt=""><span>{{ p.nom }}</span>
                <span class="chev">›</span>
              </button>
              <div class="perso-body"><div class="perso-inner">
                {% for o in p.onglets %}
                <button class="vuelink" type="button" hx-get="{{ o.route }}" hx-target="#vue"
                        data-av="{{ p.avatar }}" data-nom="{{ p.nom }}">{{ o.label }}</button>
                {% endfor %}
              </div></div>
            </div>
          {% endif %}
          {% endfor %}
        </div></div>
      </div>
      {% endfor %}
    </div>
  </aside>
</div>

<script>
  var drawer = document.getElementById('drawer');
  var menubtn = document.getElementById('menubtn');

  function openDrawer(){ drawer.hidden = false; requestAnimationFrame(function(){ drawer.classList.add('open'); }); menubtn.setAttribute('aria-expanded','true'); }
  function closeDrawer(){ drawer.classList.remove('open'); menubtn.setAttribute('aria-expanded','false'); setTimeout(function(){ drawer.hidden = true; }, 260); }

  menubtn.addEventListener('click', openDrawer);
  drawer.addEventListener('click', function(e){ if (e.target.closest('[data-close]')) closeDrawer(); });

  // Accordéon départements : un seul ouvert à la fois
  drawer.querySelectorAll('.dep-h').forEach(function(h){
    h.addEventListener('click', function(){
      var dep = h.parentElement;
      var wasOpen = dep.classList.contains('open');
      drawer.querySelectorAll('.dep.open').forEach(function(d){ d.classList.remove('open'); });
      if (!wasOpen) dep.classList.add('open');
    });
  });
  // Accordéon personnages (multi-vues)
  drawer.querySelectorAll('.perso-h').forEach(function(h){
    h.addEventListener('click', function(){ h.parentElement.classList.toggle('open'); });
  });

  // Clic sur une vue : maj avatar/nom + fermeture (HTMX charge #vue tout seul)
  drawer.querySelectorAll('.vuelink').forEach(function(b){
    b.addEventListener('click', function(){
      var av = b.getAttribute('data-av'), nom = b.getAttribute('data-nom');
      if (av) document.getElementById('agentav').src = '/static/avatars/' + av;
      if (nom) document.getElementById('agentnom').textContent = nom;
      closeDrawer();
    });
  });
</script>
</body>
</html>
