<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monique</title>
<link rel="icon" type="image/x-icon" href="/static/monique.ico">
<link rel="apple-touch-icon" href="/static/avatars/secretaire.png">
<link rel="stylesheet" href="/static/ohmie.css?v=4">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="marque">Mon<span class="pt">ique</span><span class="date">{{ date }}</span></div>
    <div class="moniquecard">
      <img class="mavatar" id="agentav" src="/static/avatars/secretaire.png" alt="">
      <div class="agentmeta">
        <div class="agentnom" id="agentnom">Secrétaire</div>
        <span class="enligne"><span class="dot"></span>En ligne</span>
      </div>
    </div>
  </header>

  <nav class="onglets" id="onglets">
    <span class="sous">Direction</span>
    <button class="onglet" hx-get="/vue/beecham" hx-target="#vue" data-av="orchestrateur.jpg" data-nom="Beecham">Beecham</button>
    <span class="sous">Secrétariat</span>
    <button class="onglet actif" hx-get="/vue/jour" hx-target="#vue" data-av="secretaire.png" data-nom="Secrétaire">Aujourd'hui</button>
    <button class="onglet" hx-get="/vue/boite" hx-target="#vue" data-av="secretaire.png" data-nom="Secrétaire">La boîte</button>
    <button class="onglet" hx-get="/vue/faire" hx-target="#vue" data-av="maitre_oeuvre.jpg" data-nom="Maître d'œuvre">À faire</button>
    <span class="sous">Comptabilité</span>
    <button class="onglet" hx-get="/vue/relances" hx-target="#vue" data-av="comptable.jpg" data-nom="Comptable">Relances</button>
    <span class="sous">Informatique</span>
    <button class="onglet" hx-get="/vue/monitoring" hx-target="#vue" data-av="veilleur.jpg" data-nom="Veilleur">Monitoring</button>
    <button class="onglet" hx-get="/vue/processus" hx-target="#vue" data-av="veilleur.jpg" data-nom="Veilleur">Système</button>
    <button class="onglet" hx-get="/vue/reglages" hx-target="#vue" data-av="developpeur.jpg" data-nom="Développeur">Réglages</button>
    <button class="onglet" hx-get="/vue/usage" hx-target="#vue" data-av="veilleur.jpg" data-nom="Veilleur">Coût</button>
    <button class="onglet" hx-get="/vue/planif" hx-target="#vue" data-av="technicien.jpg" data-nom="Technicien">Planificateur</button>
    <button class="onglet" hx-get="/vue/fournisseurs" hx-target="#vue" data-av="documentaliste.jpg" data-nom="Documentaliste">Fournisseurs</button>
    <span class="sous">Approvisionnement</span>
    <button class="onglet" hx-get="/vue/fournisseurs-materiel" hx-target="#vue" data-av="technicien.jpg" data-nom="Approvisionnement">Fournisseurs matériel</button>
    <span class="sous">Recherche / Veille</span>
    <button class="onglet" hx-get="/vue/recherche" hx-target="#vue" data-av="chercheur.jpg" data-nom="Chercheur">Recherche</button>
    <span class="sous">La brigade</span>
    <button class="onglet" hx-get="/vue/agents" hx-target="#vue" data-av="orchestrateur.jpg" data-nom="La brigade">Agents</button>
  </nav>

  <section id="vue">{% include "vue_jour.html" %}</section>
</div>

<script>
  document.getElementById('onglets').addEventListener('click', function (e) {
    var b = e.target.closest('.onglet');
    if (!b) return;
    document.querySelectorAll('.onglet').forEach(function (o) { o.classList.remove('actif'); });
    b.classList.add('actif');
    // l'avatar en haut à droite = l'agent de la page courante
    var av = b.getAttribute('data-av'), nom = b.getAttribute('data-nom');
    if (av) document.getElementById('agentav').src = '/static/avatars/' + av;
    if (nom) document.getElementById('agentnom').textContent = nom;
  });
</script>
</body>
</html>
