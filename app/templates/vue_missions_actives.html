<div class="besoin-titre">Missions en cours</div>
{% for m in missions %}
  <div class="mini bm">
    <div class="bm-corps">
      <div class="bm-l1">
        <span class="badge badge-{{ m.statut }}">{{ m.statut }}</span>
        <span class="heure">{{ m.id }}</span>
      </div>
      <div class="bm-consigne">{{ m.consigne }}</div>

      {% if m.journal_liste %}
        <p class="sous">Ce que l'agent a fait</p>
        <ul class="attendu">{% for j in m.journal_liste %}<li>{{ j }}</li>{% endfor %}</ul>
      {% endif %}
    </div>
  </div>
{% else %}
  <p class="vide">Aucune mission en cours.</p>
{% endfor %}
