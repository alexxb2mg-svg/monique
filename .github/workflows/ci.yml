name: CI Monique

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks a besoin de l'historique complet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Dépendances (épinglées) + outils
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install "ruff==0.16.2" "ty==0.0.69" pip-audit

      - name: Vulnérabilités des dépendances (pip-audit)
        run: pip-audit -r app/requirements.txt

      - name: Format (ruff)
        run: ruff format --check app scripts

      - name: Lint (ruff)
        run: ruff check app scripts

      - name: Types (ty)
        working-directory: app
        run: ty check .

      - name: Secrets à signature (gitleaks — gratuit en public)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact

      - name: Identités & chemins de poste (motifs structurels)
        run: python scripts/verifier_anonymat.py

      - name: Historique (auteurs noreply + motifs structurels sur tous les commits/tags)
        run: python scripts/verifier_anonymat.py --historique

      - name: Tests
        working-directory: app
        run: python -m pytest -q
